function learn(t,scan){stopAudio();topic=t;if(scan){state.events.push({id:state.current,topic:t,time:new Date().toLocaleString('mr-IN')});save()}let d=data[t];app.innerHTML=btn('← मुख्यपृष्ठ','render()')+`<h1>${t}</h1><div class="hero">${groups.find(g=>g.includes(t))?.[0]||'📚'}</div><div class="card"><h3>विषयाची माहिती</h3><p>${d?esc(d[0]):'या विषयाची माहिती लवकरच उपलब्ध होईल.'}</p></div>`+(d?btn('प्रश्नमंजुषा सुरू करा','quiz()'):'')}
function stopAudio(){window.speechSynthesis?.cancel()}function speak(){if(!window.speechSynthesis)return alert('ऑडिओ उपलब्ध नाही');stopAudio();let u=new SpeechSynthesisUtterance(data[topic][0]);u.lang='mr-IN';u.rate=0.85;let voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith('mr'));if(!voice)return alert('मराठी आवाज उपलब्ध नाही. उपकरणाच्या भाषा किंवा Text-to-Speech सेटिंगमध्ये मराठी आवाज जोडा.');u.voice=voice;speechSynthesis.speak(u)}function quiz(){stopAudio();questions=[];let d=data[topic];for(let i=1;i<d.length;i+=4){let a=d.slice(i+1,i+4);questions.push({q:d[i],correct:a[0],a:a.sort(()=>Math.random()-.5)})}idx=score=0;showQ()}function showQ(){chosen=false;let q=questions[idx];app.innerHTML=`<p>प्रश्न ${idx+1} / ${questions.length}</p><div class="bar"><i style="width:${(idx+1)/questions.length*100}%"></i></div><h2>${q.q}</h2>${q.a.map((a,i)=>`<button class="opt" onclick="answer(${i},this)">${a}</button>`).join('')}<div id="feedback"></div>`}function answer(i,b){if(chosen)return;chosen=true;let q=questions[idx],ok=q.a[i]===q.correct;if(ok)score++;b.classList.add(ok?'good':'bad');feedback.innerHTML=`<p>${ok?'छान! बरोबर उत्तर.':'योग्य उत्तर: '+q.correct}</p>`+btn('पुढे','next()')}function next(){if(++idx<questions.length)return showQ();state.results.push({id:state.current,topic,score,total:questions.length,time:new Date().toLocaleString('mr-IN')});save();app.innerHTML=`<div class="hero">🏆</div><h1>अभिनंदन!</h1><div class="card"><div class="stat">${score}/${questions.length}</div><p>तुमचे गुण शिक्षकांच्या अहवालात नोंदवले आहेत.</p></div>`+btn('आणखी शिकूया','render()')}
function progress(){app.innerHTML='<h2>माझी प्रगती</h2>'+state.results.filter(r=>r.id===state.current).map(r=>`<div class="card">${r.topic} · ${r.score}/${r.total}</div>`).join('')+btn('मागे','render()')}
function teacher(){let total=state.results.reduce((a,r)=>a+r.total,0),correct=state.results.reduce((a,r)=>a+r.score,0);app.innerHTML=`<h1>शिक्षक डॅशबोर्ड</h1><p class="muted">या उपकरणातील प्रात्यक्षिक नोंदी</p><div class="grid">${[[state.students.length,'विद्यार्थी'],[state.events.length,'QR स्कॅन'],[state.results.length,'प्रश्नमंजुषा'],[(total?Math.round(correct/total*100):0)+'%','सरासरी गुण']].map(([v,t])=>`<div class="card"><div class="stat">${v}</div>${t}</div>`).join('')}</div><h2>विद्यार्थी यादी</h2>`+state.students.map(s=>`<div class="card"><b>${esc(s.name)}</b> · ${esc(s.grade)}<p>स्कॅन: ${state.events.filter(r=>r.id===s.id).length} · प्रश्नमंजुषा: ${state.results.filter(r=>r.id===s.id).length}</p>${btn('सविस्तर अहवाल',`report(${s.id})`)}</div>`).join('')+btn('अभ्यास साहित्य संपादित करा','editLesson()')+btn('अहवाल डाउनलोड करा','download()')}
function report(id){let s=state.students.find(s=>s.id===id);app.innerHTML=btn('← डॅशबोर्ड','teacher()')+`<h2>${esc(s.name)}</h2><h3>स्कॅन केलेले विषय</h3>`+state.events.filter(r=>r.id===id).map(r=>`<div class="card">${r.topic}<small>${r.time}</small></div>`).join('')+'<h3>प्रश्नमंजुषा निकाल</h3>'+state.results.filter(r=>r.id===id).map(r=>`<div class="card">${r.topic} — ${r.score}/${r.total}<p>बरोबर: ${r.score} · चुकीचे: ${r.total-r.score}</p></div>`).join('')}
function download(){let rows=[['विद्यार्थी','इयत्ता','विषय','गुण','एकूण','वेळ'],...state.results.map(r=>{let s=state.students.find(s=>s.id===r.id);return [s.name,s.grade,r.topic,r.score,r.total,r.time]})];let a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')).join('\n')],{type:'text/csv;charset=utf-8'}));a.download='ज्ञानझेप-अहवाल.csv';a.click()}
function editLesson(){app.innerHTML=btn('मागे','teacher()')+`<h2>अभ्यास साहित्य संपादित करा</h2><div class="card"><label>विषय</label><select id="lt" onchange="fillLesson()">${groups.flatMap(g=>g.slice(2)).map(t=>`<option>${t}</option>`).join('')}</select><label>माहिती</label><textarea id="li" style="width:100%;min-height:100px;font:inherit"></textarea><label>प्रश्न (प्रत्येक ओळीत प्रश्न | योग्य उत्तर | चुकीचे उत्तर | चुकीचे उत्तर)</label><textarea id="lq" style="width:100%;min-height:150px;font:inherit"></textarea>${btn('जतन करा','storeLesson()')}</div>`;fillLesson()}function fillLesson(){let d=data[lt.value]||[''];li.value=d[0];let a=[];for(let i=1;i<d.length;i+=4)a.push(d.slice(i,i+4).join(' | '));lq.value=a.join('\n')}function storeLesson(){let rows=lq.value.trim().split('\n').map(x=>x.split('|').map(y=>y.trim()));if(!li.value.trim()||rows.some(r=>r.length!==4||r.some(x=>!x)))return alert('माहिती आणि योग्य स्वरूपातील प्रश्न भरा.');let d=[li.value.trim(),...rows.flat()];data[lt.value]=d;let all=JSON.parse(dzStorage.getItem('dz-lessons')||'{}');all[lt.value]=d;dzStorage.setItem('dz-lessons',JSON.stringify(all));alert('जतन केले');teacher()}

function games(){game={};app.innerHTML=btn('← मुख्यपृष्ठ','render()')+'<h1>खेळातून शिक्षण</h1><p>तुमचा आवडता खेळ निवडा!</p><div class="game-menu">'+Object.entries(gameMeta).map(([k,m])=>`<button class="game-choice" style="background:${m[3]}" onclick="startGame('${k}')"><span>${m[0]}</span><b>${m[1]}</b><small>${m[2]}</small><strong>खेळ सुरू करा →</strong></button>`).join('')+'</div>';}
function startGame(kind){first=-1;locked=false;game={kind,score:0,done:[],step:0,attempts:0,errors:0,missed:false,feedback:'',picked:-1};if(kind==='match')game.cards=shuffle(animals.map((a,i)=>({i,t:a[2]})));if(kind==='picture')game.cards=shuffle(animals);if(kind==='memory')game.cards=shuffle(animals.flatMap((a,i)=>[{i,t:a[0]},{i,t:a[0]}]));if(kind==='sequence')game.cards=shuffle(['सिंह जाळ्यात अडकला.','उंदराने जाळे कुरतडले.','सिंह मुक्त झाला.','सिंहाने उंदराचे आभार मानले.'].map((t,i)=>({t,i})));drawGame();}
function gameEnd(total){state.games??=[];state.games.push({id:state.current,kind:game.kind,score:game.score,total,date:Date.now(),attempts:game.attempts,errors:game.errors});save();app.innerHTML=`<section class="game-shell game-result"><div class="game-medal">🏆</div><h1>शाब्बास! खेळ पूर्ण झाला!</h1><p>प्रत्येक प्रयत्नातून आपण शिकतो.</p><div class="game-stars">${'★'.repeat(game.score)}${'☆'.repeat(total-game.score)}</div><div class="game-metrics"><div><b>${game.score}/${total}</b><small>पहिल्या प्रयत्नातील गुण*</small></div><div><b>${game.attempts}</b><small>एकूण प्रयत्न</small></div><div><b>${game.errors}</b><small>चुकीचे प्रयत्न</small></div></div><p>* स्मरणशक्तीच्या खेळात गुण म्हणजे सापडलेल्या जोड्या.</p>${btn('पुन्हा खेळा',"startGame('"+game.kind+"')")}${btn('इतर खेळ निवडा','games()')}</section>`;}
function drawGame(){let k=game.kind,m=gameMeta[k],progress=k==='memory'?game.done.length/2:game.step;let html=btn('← खेळ','games()')+`<section class="game-shell"><div class="game-top"><div><small>खेळातून शिक्षण</small><h2>${m[0]} ${m[1]}</h2></div><b>${progress}/4</b></div><div class="game-progress"><i style="width:${progress*25}%"></i></div><p>${m[2]}</p>`;if(k==='match'){html+=`<div class="game-prompt" style="background:${m[3]}"><span>${animals[game.step][0]}</span><h2>${animals[game.step][1]} काय खातो?</h2></div><div class="game-options">`+game.cards.map((a,i)=>`<button class="game-answer ${game.picked===i?'game-bad':''}" onclick="gamePick(${i})"><span class="food-icon">${["🍖","🌿","🍃","🍎"][a.i]}</span>${a.t}</button>`).join('')+'</div>';}if(k==='picture'){html+=`<div class="game-prompt" style="background:${m[3]}"><h1>${animals[game.step][1]}</h1><p>योग्य चित्रावर टिचकी मारा.</p></div><div class="game-options">`+game.cards.map((a,i)=>`<button class="game-answer game-picture ${game.picked===i?'game-bad':''}" aria-label="चित्र ${i+1}" onclick="gamePick(${i})">${a[0]}</button>`).join('')+'</div>';}if(k==='memory'){html+='<div class="game-memory">'+game.cards.map((a,i)=>{let done=game.done.includes(i),open=done||first===i||game.second===i;return `<button class="memory-card ${done?'matched':open?'revealed':''}" onclick="gamePick(${i})" ${done?'disabled':''} aria-label="${open?a.t:'बंद कार्ड '+(i+1)}">${open?a.t:'?'}</button>`}).join('')+'</div>';}if(k==='sequence'){html+='<div class="game-story"><span>🦁 🐭</span><h3>सिंह आणि उंदीर</h3></div><div class="game-order">'+Array.from({length:4},(_,i)=>`<div class="${i<game.done.length?'filled':''}"><b>${i+1}</b>${i<game.done.length?game.cards[game.done[i]].t:'येथे घटना निवडा'}</div>`).join('')+'</div><div class="game-options">'+game.cards.map((a,i)=>game.done.includes(i)?'':`<button class="game-answer ${game.picked===i?'game-bad':''}" onclick="gamePick(${i})"><span class="event-icon">${["🦁🕸️","🐭🕸️","🦁","🦁🐭"][a.i]}</span>${a.t}</button>`).join('')+'</div>';}app.innerHTML=html+`<div id="gamefeedback" class="game-feedback" data-tone="${game.picked>=0?'bad':(game.feedback.startsWith('छान')||game.feedback.startsWith('अगदी'))?'good':'neutral'}" role="status">${game.feedback||'योग्य पर्याय निवडा.'}</div></section>`;}
function gamePick(i){if(locked)return;let k=game.kind;if(k==='memory'){if(first===i||game.done.includes(i))return;if(first<0){first=i;game.feedback='आता दुसरे कार्ड निवडा.';drawGame();return;}game.attempts++;game.second=i;locked=true;let ok=game.cards[first].i===game.cards[i].i;game.feedback=ok?'छान! जोडी सापडली.':'पुन्हा प्रयत्न करा.';if(!ok)game.errors++;drawGame();let active=game;setTimeout(()=>{if(game!==active||!document.getElementById('gamefeedback'))return;if(ok){game.done.push(first,i);game.score++;}first=-1;delete game.second;locked=false;if(game.done.length===8)gameEnd(4);else drawGame();},850);return;}game.attempts++;let ok=k==='match'?game.cards[i].i===game.step:k==='picture'?game.cards[i][1]===animals[game.step][1]:game.cards[i].i===game.step;if(!ok){game.errors++;game.missed=true;game.picked=i;game.feedback='काही हरकत नाही! पुन्हा प्रयत्न करा.';drawGame();return;}if(!game.missed)game.score++;game.missed=false;game.picked=-1;game.feedback='अगदी बरोबर! शाब्बास!';locked=true;document.getElementById('gamefeedback').textContent=game.feedback;document.getElementById('gamefeedback').dataset.tone='good';document.querySelectorAll('.game-answer')[k==='sequence'?Array.from(document.querySelectorAll('.game-answer')).findIndex(b=>b.getAttribute('onclick')==='gamePick('+i+')'):i]?.classList.add('game-good');let active=game;setTimeout(()=>{if(game!==active||!document.getElementById('gamefeedback'))return;locked=false;if(k==='sequence')game.done.push(i);if(++game.step===4)gameEnd(4);else {game.feedback='';drawGame();}},950);}
const priorRender=render;render=function(){revisionKey=null;priorRender();if(mode==='student'&&current()){let due=Object.values(state.revisions||{}).filter(r=>r.id===state.current&&r.stage<4&&r.due<=Date.now()).length;app.insertAdjacentHTML('afterbegin',`<div class="card"><div class="grid">${btn('🎮 खेळातून शिक्षण','games()')}${btn('📅 माझी उजळणी ('+due+')','revisionPage()')}</div></div>`);}};
const priorReport=report;report=function(id){priorReport(id);app.insertAdjacentHTML('beforeend','<h2>उजळणी अहवाल</h2>'+Object.values(state.revisions||{}).filter(r=>r.id===id).map(r=>`<div class="card">${esc(r.topic)} · ${r.stage}/4${r.history.map(h=>`<p>${new Date(h.date).toLocaleDateString('mr-IN')} — ${h.score}/${h.total}</p>`).join('')}</div>`).join('')+'<h2>शैक्षणिक खेळ</h2>'+ (state.games||[]).filter(g=>g.id===id).map(g=>`<div class="card">${({match:'जोड्या लावा',picture:'चित्र ओळखा',memory:'स्मरणशक्ती',sequence:'योग्य क्रम'})[g.kind]} — ${g.score}/${g.total}</div>`).join(''));};
let cameraStream=null,cameraRun=0,qrLoader=null;
function stopCamera(){cameraRun++;if(cameraStream){cameraStream.getTracks().forEach(t=>t.stop());cameraStream=null;}let v=document.getElementById('qrVideo');if(v)v.srcObject=null;}
function mobileScan(){stopAudio();stopCamera();app.innerHTML=`<section class="mobileScan"><button class="scanBack" onclick="render()">← मागे</button><h2>QR कोड स्कॅन करा</h2><p>कॅमेरा QR कोडसमोर धरा.</p><div class="scanView"><video id="qrVideo" autoplay muted playsinline></video><div class="scanFrame"><i></i></div><span class="scanHint">QR कोड चौकटीत ठेवा</span></div><p id="qrmsg" role="status" aria-live="polite">कॅमेरा सुरू करण्यासाठी खाली टिचकी मारा.</p><button class="wide" onclick="startCamera()">कॅमेरा सुरू करा</button><label class="wide scanSecondary picker">QR कोडचा फोटो काढा<input id="qrCapture" type="file" accept="image/*" capture="environment" onchange="readQR(this.files[0])"></label><label class="wide scanSecondary picker">गॅलरीमधून फोटो निवडा<input id="qrGallery" type="file" accept="image/*" onchange="readQR(this.files[0])"></label><details><summary>QR दुवा स्वतः टाका</summary><p>फोनच्या Camera किंवा Photos मधून QR दुवा कॉपी करा.</p><input id="manualQR" type="url" placeholder="https://…"><button class="wide" onclick="showScannedLinks([document.getElementById('manualQR').value],document.getElementById('qrmsg'))">दुवा तपासा</button></details><button class="wide scanSecondary" onclick="stopCamera();document.getElementById('qrmsg').textContent='कॅमेरा बंद केला.'">कॅमेरा बंद करा</button><details><summary>प्रात्यक्षिकासाठी विषय निवडा</summary>${Object.keys(data).map(t=>`<button class="opt" onclick="stopCamera();learn('${t}',true)">${t} — नमुना स्कॅन</button>`).join('')}</details></section>`;}
function loadQR(){if(window.jsQR)return Promise.resolve();if(!qrLoader)qrLoader=(async()=>{for(const url of ['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js','https://unpkg.com/jsqr@1.4.0/dist/jsQR.js','https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js']){try{await new Promise((resolve,reject)=>{const el=document.createElement('script');const timer=setTimeout(()=>{el.remove();reject(Error('timeout'))},5000);el.src=url;el.onload=()=>{clearTimeout(timer);window.jsQR?resolve():reject(Error('decoder missing'))};el.onerror=()=>{clearTimeout(timer);el.remove();reject(Error('network'))};document.head.append(el)});return}catch(e){}}throw Error('decoder unavailable')})().catch(e=>{qrLoader=null;throw e});return qrLoader;}
async function startCamera(){stopCamera();let run=cameraRun,msg=document.getElementById('qrmsg'),v=document.getElementById('qrVideo');if(!navigator.mediaDevices?.getUserMedia){msg.textContent='थेट कॅमेरासाठी HTTPS आवश्यक आहे. फोटो काढा किंवा गॅलरी वापरा.';return;}try{let stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});if(run!==cameraRun||!v.isConnected){stream.getTracks().forEach(t=>t.stop());return;}cameraStream=stream;v.srcObject=stream;await v.play();let detector=null;try{if(window.BarcodeDetector)detector=new BarcodeDetector({formats:['qr_code']});}catch(e){}if(!detector){msg.textContent='QR वाचक लोड होत आहे…';await loadQR();}msg.textContent='QR कोड शोधत आहे…';let cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});async function tick(){if(run!==cameraRun||!v.isConnected){if(run===cameraRun)stopCamera();return;}try{if(v.readyState>=2){let raw=[];if(detector){try{raw=(await detector.detect(v)).map(x=>x.rawValue);}catch(e){detector=null;await loadQR();}}if(!detector){let scale=Math.min(1,1000/v.videoWidth);cv.width=Math.round(v.videoWidth*scale);cv.height=Math.round(v.videoHeight*scale);ctx.drawImage(v,0,0,cv.width,cv.height);let d=ctx.getImageData(0,0,cv.width,cv.height),r=window.jsQR(d.data,d.width,d.height);if(r)raw=[r.data];}if(run!==cameraRun)return;if(raw.length){stopCamera();showScannedLinks(raw,msg);return;let names=[...new Set(raw.flatMap(r=>[...qrTopics(r),...Object.keys(data).filter(k=>r===k||r==='dz:'+k)]))];for(let r of raw)for(let t of qrTopics(r))scannedSources[t]=r;if(names.length===1){learn(names[0],true);return;}if(names.length){qrChoices(names,msg);return;}msg.textContent='QR सापडला, पण विषय जोडलेला नाही.';for(const r of raw){let u=safeURL(r);if(!u)continue;let a=document.createElement('a');a.href=u.href;a.target='_blank';a.rel='noopener noreferrer';a.textContent=youtubeId(u)?'▶ YouTube वर व्हिडिओ पहा':'मूळ दुवा उघडा';a.style='display:block;padding:14px';msg.append(a);}return;}}}catch(e){stopCamera();msg.textContent='QR वाचता आला नाही. फोटो पर्याय वापरा.';return;}setTimeout(tick,220);}tick();}catch(e){if(run===cameraRun){stopCamera();msg.textContent=e.message==='decoder unavailable'?'QR वाचक लोड झाला नाही. इंटरनेट तपासा किंवा QR दुवा स्वतः टाका.':'कॅमेरा सुरू झाला नाही: '+(e.name||'त्रुटी')+'. Safari मध्ये कॅमेरा परवानगी तपासा.';}}}
window.addEventListener('pagehide',stopCamera);document.addEventListener('visibilitychange',()=>{if(document.hidden)stopCamera()});new MutationObserver(()=>{if(cameraStream&&!document.getElementById('qrVideo'))stopCamera()}).observe(app,{childList:true,subtree:true});

scan=mobileScan;
function showScannedLinks(raw,msg){msg.replaceChildren();let urls=[...new Set(raw.map(x=>safeURL(x.trim())?.href).filter(Boolean))];if(!urls.length){msg.textContent='या QR मध्ये वेबसाइटचा दुवा नाही.';return;}msg.textContent='QR कोड सापडला! दुवा उघडा.';for(let url of urls){let u=safeURL(url),a=document.createElement('a');a.href=url;a.textContent=youtubeId(u)?'▶ YouTube वर व्हिडिओ पहा':'मूळ दुवा उघडा ↗';a.style='display:block;background:#563db5;color:white;padding:18px;border-radius:14px;text-align:center;margin:12px 0;text-decoration:none;font-weight:bold';msg.append(a);let host=document.createElement('small');host.textContent=u.hostname;msg.append(host);for(let t of qrTopics(url)){scannedSources[t]=url;let b=document.createElement('button');b.className='wide scanSecondary';b.textContent=t+' — अभ्यास करा';b.onclick=()=>learn(t,true);msg.append(b);}}if(urls.length===1){let a=msg.querySelector('a');a.textContent+=' (येथे टिचकी मारा)';}}
readQR=async function(file){if(!file)return;stopCamera();let msg=document.getElementById('qrmsg');if(!msg)return;msg.textContent='फोटो तपासत आहे…';let objectURL=URL.createObjectURL(file);try{let im=new Image();await new Promise((resolve,reject)=>{im.onload=resolve;im.onerror=reject;im.src=objectURL;});if(!msg.isConnected)return;let preview=document.createElement('img');preview.src=objectURL;preview.style='width:100%;max-height:240px;object-fit:contain;border-radius:12px';msg.replaceChildren(preview,document.createTextNode(' QR शोधत आहे…'));let found=[];if(window.BarcodeDetector){try{found=(await new BarcodeDetector({formats:['qr_code']}).detect(im)).map(x=>x.rawValue)}catch(e){}}if(!found.length){msg.append(document.createTextNode(' QR वाचक लोड होत आहे…'));await loadQR();let cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});for(let size of [1800,1000,2600]){let scale=Math.min(1,size/Math.max(im.naturalWidth,im.naturalHeight));cv.width=Math.round(im.naturalWidth*scale);cv.height=Math.round(im.naturalHeight*scale);ctx.drawImage(im,0,0,cv.width,cv.height);for(let j=0;j<12;j++){let d=ctx.getImageData(0,0,cv.width,cv.height),r=window.jsQR(d.data,d.width,d.height);if(!r)break;found.push(r.data);let l=r.location;ctx.fillStyle='white';ctx.beginPath();[l.topLeftCorner,l.topRightCorner,l.bottomRightCorner,l.bottomLeftCorner].forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fill();}if(found.length)break;}}if(!msg.isConnected)return;if(found.length)showScannedLinks(found,msg);else msg.textContent='QR सापडला नाही. एका QR कोडचा स्पष्ट फोटो निवडा.';}catch(e){if(msg.isConnected)msg.textContent=e.message==='decoder unavailable'?'QR वाचक लोड झाला नाही. इंटरनेट तपासा किंवा QR दुवा स्वतः टाका.':'फोटो वाचता आला नाही. स्पष्ट JPEG किंवा PNG फोटो वापरा.';}finally{URL.revokeObjectURL(objectURL);for(let id of ['qrCapture','qrGallery']){let el=document.getElementById(id);if(el)el.value='';}}};
render();</script><script>document.getElementById('dzStart').addEventListener('click',function(){document.getElementById('dzSplash').hidden=true;document.getElementById('dzShell').hidden=false;window.scrollTo(0,0);});</script></body></html>
